name: Update language gauge

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - run: python scripts/test_update_languages.py
      - name: Update card
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_LANGUAGES_TOKEN: ${{ secrets.PROFILE_LANGUAGES_TOKEN }}
        run: |
          if [ -z "$PROFILE_LANGUAGES_TOKEN" ]; then
            echo '::warning::PROFILE_LANGUAGES_TOKEN is missing; keeping the existing card'
            exit 0
          fi
          python scripts/update_languages.py
      - name: Commit changed card
        run: |
          git add -A README.md assets
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '언어 게이지 갱신'
          git push
