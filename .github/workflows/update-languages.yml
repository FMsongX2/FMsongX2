name: Update language gauge

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check Pillow==12.3.0
      - run: python scripts/test_update_languages.py
      - run: python scripts/update_languages.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit changed card
        run: |
          if git diff --quiet -- README.md assets/hanabi-github-languages-night.png; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/hanabi-github-languages-night.png
          git commit -m '언어 게이지 갱신'
          git push
