name: Update 3D contributions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: config/profile-3d.json
      - name: Keep contribution graph only
        run: python3 scripts/trim_3d_contrib.py profile-3d-contrib/profile-hanabi-grass.svg
      - name: Compose animated showcase
        run: >-
          python3 scripts/compose_3d_showcase.py
          profile-3d-contrib/profile-hanabi-grass.svg
          assets/hanabi-sparkles-pose-overlay.apng
          assets/hanabi-sparkles-smile-overlay.apng
          profile-3d-contrib/profile-hanabi-showcase.svg
      - name: Commit changed graph
        run: |
          git add -A profile-3d-contrib
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '3D 기여 그래프 갱신'
          git push
